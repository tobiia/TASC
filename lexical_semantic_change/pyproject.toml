[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "LSC"
version = "0.1.0"
requires-python = ">=3.10"
authors = [{ name = "Tobi Adesanya", email = "tobijadesanya@gmail.com" }]
description = "A comprehensive framework for analyzing lexical semantic change across corpora."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "transformers",
    "sentence-transformers",
    "spacy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
score = "LSC.assessment.scoring:main"
run = "LSC.main:main"

[tool.hatch.build.targets.wheel]
packages = ["LSC"]
