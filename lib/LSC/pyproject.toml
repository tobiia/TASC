[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lsc"
version = "1.0.0"
requires-python = ">=3.10"
authors = [{ name = "Tobi Adesanya", email = "tobijadesanya@gmail.com" }]
description = "A framework for analyzing lexical semantic change across corpora."
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20.0",
    "pandas",
    "transformers",
    "spacy",
    "tqdm",
    "torch",
    "scikit-learn>=1.2.0",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
lsc = "lsc.main:main"
score = "lsc.assessment.scoring:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lsc"]
