[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tasc"
version = "1.0.0"
requires-python = ">=3.12"
authors = [{ name = "Tobi Adesanya", email = "tobijadesanya@gmail.com" }]
description = "A interactive 3D visualization for analyzing lexical semantic change across corpora with integrated topic modeling."
readme = "README.md"
license = { text = "MIT" }
dependencies = ["fastapi", "uvicorn", "colorama"]

[project.scripts]
tasc = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
