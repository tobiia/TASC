[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsc"
version = "0.1.0"
requires-python = ">=3.10"
authors = [{ name = "Tobi Adesanya", email = "tobijadesanya@gmail.com" }]
description = "A comprehensive framework for analyzing lexical semantic change across corpora with integrated topic modeling and interactive 3D visualization."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "transformers",
    "spacy",
    "top2vec",
    "fastapi",
    "uvicorn[standard]",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
lsc-score = "lexical_semantic_change.assessment.scoring:main"
lsc-run = "lexical_semantic_change.main:main"
tsc-dev = "topical_semantic_change.dev:main"

[tool.hatch.build.targets.wheel]
packages = ["lexical_semantic_change", "topical_semantic_change"]
